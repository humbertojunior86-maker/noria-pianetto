<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CORTEX · Pianetto Transportes</title>
<meta name="description" content="Cérebro corporativo autônomo da Pianetto Transportes — agentes, confrontos e conciliação ATUA × bancos." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 27 9v14L16 29 5 23V9z' fill='none' stroke='%23f0b429' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f0b429'/%3E%3C/svg%3E">
</head>
<body>

<!-- INICIALIZAÇÃO -->
<div id="boot">
  <canvas id="bootCanvas"></canvas>
  <div class="boot-overlay">
    <div class="boot-top">
      <div>
        <p class="boot-title"><b>CORTEX</b> · Cérebro Corporativo</p>
        <p class="boot-title" style="margin-top:6px">Pianetto Transportes</p>
      </div>
      <button class="boot-skip" id="bootSkip" type="button">Pular inicialização</button>
    </div>
    <div class="boot-bottom">
      <div class="boot-log" id="bootLog" aria-live="polite"></div>
      <div class="boot-bar"><i id="bootBar"></i></div>
      <div class="boot-meta">
        <span>Instância isolada · cortex-prod-01</span>
        <span>Sincronizando núcleo · <span id="bootPct">000%</span></span>
      </div>
    </div>
  </div>
</div>

<!-- APLICAÇÃO -->
<div class="shell" id="shell">
  <aside class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-label="Logo CORTEX" role="img">
        <path d="M16 2.5 27.5 9v14L16 29.5 4.5 23V9z" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M16 8.5 22 12v7l-6 3.5L10 19v-7z" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/>
        <circle cx="16" cy="15.7" r="2.6" fill="currentColor"/>
      </svg>
      <div>
        <h1>CORTEX</h1>
        <span>Pianetto Transportes</span>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
    <div class="side-foot">
      <canvas id="miniBrain" style="width:100%;height:74px;display:block;margin-bottom:6px"></canvas>
      <div class="row"><span>Núcleo</span><b>operando</b></div>
      <div class="row"><span>Sinais hoje</span><b class="num" id="footSinais">—</b></div>
      <div class="row"><span>Custo do dia</span><b class="num" id="footCusto">—</b></div>
      <div class="row"><span>Versão</span><b>1.0.4</b></div>
    </div>
  </aside>

  <header class="top">
    <span class="pulse-dot" aria-hidden="true"></span>
    <div>
      <h2 id="topTitle">Sala do CEO</h2>
      <p class="sub" id="topSub">—</p>
    </div>
    <div class="spacer"></div>
    <div class="top-stat"><span class="eyebrow">Em risco</span><b id="topRisco" style="color:var(--crit)">—</b></div>
    <div class="top-stat"><span class="eyebrow">Recuperado/mês</span><b id="topRec" style="color:var(--ok)">—</b></div>
    <div class="top-stat"><span class="eyebrow">Varredura</span><b id="topVar">—</b></div>
  </header>

  <main class="main" id="main"></main>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script src="js/ofx.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
