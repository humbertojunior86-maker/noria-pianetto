<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NÓRIA · Pianetto Transportes</title>
<meta name="description" content="NÓRIA — estrutura pensante autônoma da Pianetto Transportes: missões, validação em camadas e evidência por afirmação." />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/app.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%2350D6BC' stroke-width='1.6' fill='none'%3E%3Ccircle cx='16' cy='16' r='11' opacity='.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2350D6BC'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>
<noscript>
  <p style="padding:24px">A NÓRIA precisa de JavaScript para falar com a API.</p>
</noscript>

<!-- Primeira pintura: nunca um retângulo preto sem explicação. Some sozinho
     assim que a aplicação monta a tela por cima. -->
<div id="primeira-pintura" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:#101318;color:#6F7B8C;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase">
  <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
    <g stroke="#50D6BC" stroke-width="1.6" fill="none">
      <circle cx="16" cy="16" r="11" opacity=".35">
        <animate attributeName="opacity" values=".15;.5;.15" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="16" cy="16" r="4" fill="#50D6BC"/>
    </g>
  </svg>
  <span>carregando a NÓRIA</span>
</div>

<script src="js/salvavidas.js"></script>
<script src="js/ofx.js"></script>
<script type="module" src="js/app.js"></script>
<script>
  // Navegador que não entende módulos ES nunca executa app.js e ficaria preto.
  if (!('noModule' in HTMLScriptElement.prototype)) {
    document.getElementById('primeira-pintura').innerHTML =
      '<p style="max-width:420px;text-align:center;text-transform:none;letter-spacing:0;font-size:15px;color:#F3F5F7;line-height:1.6">' +
      'Este navegador é antigo demais para a NÓRIA. Abra em um Chrome, Safari ou Edge atualizado.</p>';
  }
</script>
</body>
</html>
